<div class="sandbox">
  <div class="sandbox__toolbar">
    <app-theme-switcher
      [theme]="sandboxTheme()"
      (themeChange)="setSandboxTheme($any($event))"
    />

    <button
      type="button"
      class="sandbox__reset"
      (click)="resetSandbox()"
    >
      {{ 'common.reset' | localize }}
    </button>
  </div>

  <div class="sandbox__content">
    <div class="sandbox__preview">
      <h4 class="sandbox__section-title">{{ 'common.preview' | localize }}</h4>

      <div
        class="sandbox__preview-surface"
        #previewSurface
        [class.ndwu-theme-light]="sandboxTheme() === 'light'"
        [class.ndwu-theme-dark]="sandboxTheme() === 'dark'"
        [ngStyle]="sandboxTokenStyles()"
      >
        <ndwu-spokes-loader
          [size]="sandboxForm.controls.size.value"
          [spokes]="sandboxForm.controls.spokes.value"
          [duration]="sandboxForm.controls.duration.value"
          [spokeWidth]="sandboxForm.controls.spokeWidth.value"
          [spokeHeight]="getSpokeHeightValue()"
          [spokeOffset]="getSpokeOffsetValue()"
          [autostart]="sandboxForm.controls.autostart.value"
        />
      </div>
    </div>

    <div class="sandbox__bottom">
      <div class="sandbox__controls">
        <h4 class="sandbox__section-title">{{ 'common.controls' | localize }}</h4>

        <form [formGroup]="sandboxForm" class="sandbox__controls-form">
          <div class="sandbox__control-row">
            <label
              class="sandbox__control-label"
              for="sandbox-size"
            >
              {{ 'spokes-loader-showcase.sandbox.size' | localize }}
            </label>
            <input
              id="sandbox-size"
              class="sandbox__control-input"
              type="number"
              min="8"
              max="200"
              formControlName="size"
            />
          </div>

          <div class="sandbox__control-row">
            <label
              class="sandbox__control-label"
              for="sandbox-spokes"
            >
              {{ 'spokes-loader-showcase.sandbox.spokes' | localize }}
            </label>
            <div style="display: flex; align-items: center; gap: 10px; flex: 1;">
              <input
                id="sandbox-spokes"
                class="sandbox__control-input"
                type="range"
                min="3"
                max="12"
                step="1"
                formControlName="spokes"
                style="flex: 1;"
              />
              <span style="min-width: 30px; text-align: right; font-weight: 600; font-size: 0.9rem; color: #333;">
                {{ sandboxForm.controls.spokes.value }}
              </span>
            </div>
          </div>

          <div class="sandbox__control-row">
            <label
              class="sandbox__control-label"
              for="sandbox-duration"
            >
              {{ 'spokes-loader-showcase.sandbox.duration' | localize }}
            </label>
            <input
              id="sandbox-duration"
              class="sandbox__control-input"
              type="number"
              min="100"
              formControlName="duration"
            />
          </div>

          <div class="sandbox__control-row">
            <label
              class="sandbox__control-label"
              for="sandbox-spoke-width"
            >
              {{ 'spokes-loader-showcase.sandbox.spoke-width' | localize }}
            </label>
            <input
              id="sandbox-spoke-width"
              class="sandbox__control-input"
              type="number"
              min="0.5"
              step="0.5"
              formControlName="spokeWidth"
            />
          </div>

          <div class="sandbox__control-row">
            <label
              class="sandbox__control-label"
              for="sandbox-spoke-height"
            >
              {{ 'spokes-loader-showcase.sandbox.spoke-height' | localize }}
            </label>
            <input
              id="sandbox-spoke-height"
              class="sandbox__control-input"
              type="number"
              min="1"
              placeholder="{{ 'spokes-loader-showcase.sandbox.spoke-height-placeholder' | localize }}"
              formControlName="spokeHeight"
            />
          </div>

          <div class="sandbox__control-row">
            <label
              class="sandbox__control-label"
              for="sandbox-spoke-offset"
            >
              {{ 'spokes-loader-showcase.sandbox.spoke-offset' | localize }}
            </label>
            <input
              id="sandbox-spoke-offset"
              class="sandbox__control-input"
              type="number"
              min="0"
              step="0.5"
              placeholder="{{ 'spokes-loader-showcase.sandbox.spoke-offset-placeholder' | localize }}"
              formControlName="spokeOffset"
            />
          </div>

          <div class="sandbox__control-row sandbox__control-row--checkboxes">
            <label class="sandbox__checkbox">
              <input type="checkbox" formControlName="autostart"/>
              <span>{{ 'spokes-loader-showcase.sandbox.autostart' | localize }}</span>
            </label>
          </div>
        </form>
      </div>

      <div class="sandbox__variables">
        <app-token-list
          [tokens]="tokenList"
          [formGroup]="sandboxTokens"
          [tokenPickerValues]="tokenPickerValues()"
          [sectionTitle]="'spokes-loader-showcase.sandbox.tokens' | localize"
          [inheritLabel]="'spokes-loader-showcase.sandbox.inherit' | localize"
        />
      </div>
    </div>
  </div>
</div>
