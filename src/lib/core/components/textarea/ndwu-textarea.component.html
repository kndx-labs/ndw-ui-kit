<div
  #box
  class="ndwu-textarea__box ndwu-form-field__input"
  [class.ndwu-form-field__input--invalid]="invalid()"
  [class.ndwu-textarea__box--focused]="focused() && !readonly()"
  [class.ndwu-textarea__box--disabled]="disabled"
  [class.ndwu-textarea__box--readonly]="readonly()"
  [class.ndwu-textarea__box--loading]="loading()"
  [class.ndwu-textarea__box--has-actions]="hasActions()"
  [class.ndwu-textarea__box--line-numbers]="showLineNumbers()"
  [style.--ndwu-textarea-actions-width]="actionsWidth()"
  [style.--ndwu-textarea-actions-height]="actionsHeight()"
  [style.height.px]="height()"
  [attr.aria-busy]="loading() ? 'true' : null"
>
  @if (hasActions()) {
    <div
      class="ndwu-textarea__actions-mask"
      aria-hidden="true"
    >
    </div>
  }

  <div
    class="ndwu-textarea__viewport"
    ndwuScrollbar
    [ndwuScrollbarSize]="scrollbarSize()"
  >
    <div class="ndwu-textarea__content">
      @if (showLineNumbers()) {
        <div
          class="ndwu-textarea__gutter"
          aria-hidden="true"
        >
          @for (line of lineNumbers(); track line) {
            <span class="ndwu-textarea__line-number">{{ line }}</span>
          }
        </div>
      }

      <div class="ndwu-textarea__sizer">
        <span
          class="ndwu-textarea__replica"
          aria-hidden="true"
        >
          {{ currentValue() }}
        </span>

        <textarea
          #textarea
          class="ndwu-textarea__control"
          rows="1"
          [id]="id"
          [value]="currentValue()"
          [placeholder]="placeholder() ? (placeholder() | localize) : ''"
          [disabled]="disabledInput() || loading()"
          [readonly]="readonly()"
          [attr.wrap]="showLineNumbers() ? 'off' : null"
          [attr.aria-label]="ariaLabel() ? (ariaLabel() | localize) : null"
          [attr.aria-required]="required() ? 'true' : null"
          [attr.aria-invalid]="invalid() ? 'true' : null"
          [attr.aria-describedby]="ariaDescribedby()"
          (input)="onInput($event)"
          (focus)="focused.set(true)"
          (blur)="onBlur()"
        >
        </textarea>
      </div>
    </div>
  </div>

  @if (loading()) {
    <div class="ndwu-textarea__loading">
      <ndwu-spokes-loader />

      @if (loadingLabel()) {
        <span class="ndwu-textarea__loading-label">{{ loadingLabel() | localize }}</span>
      }
    </div>
  }

  <div
    #actionsSlot
    class="ndwu-textarea__actions-slot"
    [ndwuResizeObserver]="true"
  >
    <ng-content select="[ndwuTextareaActions]" />
  </div>

  @if (resizable()) {
    <span
      class="ndwu-textarea__resizer"
      aria-hidden="true"
      (pointerdown)="onResizeStart($event)"
      (pointermove)="onResizeMove($event)"
      (lostpointercapture)="onResizeEnd()"
    >
      <ndwu-icon [name]="ICON_NAME.NOTCHES_S" />
    </span>
  }
</div>
