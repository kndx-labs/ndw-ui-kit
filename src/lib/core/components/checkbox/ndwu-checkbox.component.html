<div [class]="rootClass()">
  <input
    #checkboxInput
    type="checkbox"
    class="ndwu-checkbox__input"
    [class.ndwu-checkbox__input--no-label]="!label() && !secondaryText()"
    [class.ndwu-checkbox__input--invalid]="invalid()"
    [id]="inputId()"
    [checked]="checked()"
    [disabled]="disabled()"
    [attr.tabindex]="inputTabIndex()"
    [attr.name]="name()"
    [attr.value]="value()"
    [attr.required]="required() || null"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-labelledby]="ariaLabelledby()"
    [attr.aria-describedby]="ariaDescribedby()"
    (change)="onCheckboxChange($event)"
    (focus)="onFocus()"
    (blur)="onBlur()"
  />

  @if (label() || secondaryText()) {
    <label [for]="inputId()">
      <ndwu-label-group
        [label]="label()"
        [secondaryText]="secondaryText()"
        [disabled]="disabled()"
        [size]="sizeSvc.effectiveSize()"
      />
    </label>
  }
</div>
