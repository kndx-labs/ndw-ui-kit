<ndwu-file-upload
  [size]="sizeSvc.size()"
  [multiple]="multiple()"
  [accept]="accept()"
  [maxSizeMB]="maxSizeMB()"
  [disabled]="isDisabled"
  [initialFiles]="inputValue"
  [translationTexts]="translationTexts()"
  (filesChange)="onFilesChange($event)"
  (uploadRequest)="uploadRequest.emit($event)"
  (cancelRequest)="cancelRequest.emit($event)"
  (blurred)="onBlur()"
/>
