<div class="index-page">
  <div class="index-page__header">
    <app-logo class="index-page__logo"></app-logo>
    <p class="index-page__subtitle">{{ COMPONENTS.length }} {{ 'app.components' | localize }} <span class="index-page__version">v{{ LIB_INFO.version }}</span></p>
  </div>

  <div class="index-page__grid">
    @for (component of COMPONENTS; track component) {
      <button
        type="button"
        class="component-card"
        (click)="select(component)"
      >
        <div class="component-card__header">
          <span class="component-card__name">{{ 'components.' + component + '.name' | localize }}</span>
          @if (isReadyForReview(component)) {
            <span class="component-card__badge">{{ 'app.ready' | localize }}</span>
          }
        </div>
        <p class="component-card__description">{{ 'components.' + component + '.description' | localize }}</p>
      </button>
    }
  </div>
</div>
