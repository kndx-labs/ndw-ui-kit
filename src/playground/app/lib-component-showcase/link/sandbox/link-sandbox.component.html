<div class="sandbox">
  <div class="sandbox__toolbar">
    <app-theme-switcher
      [theme]="sandboxTheme()"
      (themeChange)="setSandboxTheme($any($event))"
    />

    <button
      type="button"
      class="sandbox__reset"
      (click)="resetSandbox()"
    >
      {{ 'common.reset' | localize }}
    </button>
  </div>

  <div class="sandbox__content">
    <div class="sandbox__preview">
      <h4 class="sandbox__section-title">{{ 'common.preview' | localize }}</h4>

      <div
        class="sandbox__preview-surface"
        #previewSurface
        [class.ndwu-theme-light]="sandboxTheme() === 'light'"
        [class.ndwu-theme-dark]="sandboxTheme() === 'dark'"
        [ngStyle]="sandboxTokenStyles()"
      >
        <a
          ndwu-link
          [href]="sandboxForm.controls.href.value"
          [disabled]="isPreviewDisabled"
          [external]="sandboxForm.controls.external.value"
          [icon]="sandboxForm.controls.icon.value"
          [ngClass]="previewStateClass"
        >
          {{ sandboxForm.controls.label.value }}
        </a>
      </div>
    </div>

    <div class="sandbox__bottom">
      <div class="sandbox__controls">
        <h4 class="sandbox__section-title">{{ 'common.controls' | localize }}</h4>

        <form [formGroup]="sandboxForm" class="sandbox__controls-form">
          <div class="sandbox__control-row">
            <label class="sandbox__control-label" for="sandbox-label">{{ 'common.label' | localize }}</label>
            <input id="sandbox-label" class="sandbox__control-input" type="text" formControlName="label"/>
          </div>

          <div class="sandbox__control-row">
            <label
              class="sandbox__control-label"
              for="sandbox-href"
            >
              {{ 'link-showcase.sandbox.href' | localize }}
            </label>
            <input id="sandbox-href" class="sandbox__control-input" type="text" formControlName="href"/>
          </div>

          <div class="sandbox__control-row">
            <label class="sandbox__control-label"
                   for="sandbox-state">{{ 'link-showcase.sandbox.state' | localize }}</label>
            <select id="sandbox-state" class="sandbox__control-input" formControlName="state">
              <option [value]="LINK_STATE.DEFAULT">{{ 'link-showcase.state-default' | localize }}</option>
              <option [value]="LINK_STATE.HOVER">{{ 'link-showcase.state-hover' | localize }}</option>
              <option [value]="LINK_STATE.PRESSED">{{ 'link-showcase.state-pressed' | localize }}</option>
              <option [value]="LINK_STATE.FOCUSED">{{ 'link-showcase.state-focused' | localize }}</option>
              <option [value]="LINK_STATE.VISITED">{{ 'link-showcase.state-visited' | localize }}</option>
              <option [value]="LINK_STATE.DISABLED">{{ 'link-showcase.state-disabled' | localize }}</option>
            </select>
          </div>

          <div class="sandbox__control-row">
            <label class="sandbox__control-label" for="sandbox-icon">Icon</label>
            <select id="sandbox-icon" class="sandbox__control-input" formControlName="icon">
              @for (iconName of SANDBOX_ICONS; track iconName) {
                <option [ngValue]="iconName">{{ iconName }}</option>
              }
            </select>
          </div>

          <div class="sandbox__control-row sandbox__control-row--checkboxes">
            <label class="sandbox__checkbox">
              <input type="checkbox" formControlName="external"/>
              <span>external (show icon)</span>
            </label>
          </div>
        </form>
      </div>

      <div class="sandbox__variables">
        <app-token-list
          [tokens]="tokenListForCurrentType()"
          [formGroup]="sandboxTokens"
          [tokenPickerValues]="tokenPickerValues()"
          [sectionTitle]="'link-showcase.sandbox.tokens' | localize"
          [inheritLabel]="'link-showcase.sandbox.inherit' | localize"
        />
      </div>
    </div>
  </div>
</div>
