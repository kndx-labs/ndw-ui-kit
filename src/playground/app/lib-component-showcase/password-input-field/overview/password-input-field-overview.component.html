<app-showcase-layout
  lightTitleKey="common.themes.light"
  darkTitleKey="common.themes.dark"
>
  <ng-template>
    <div class="state-section">
      <h4>{{ 'password-input-field-showcase.default' | localize }}</h4>
      <form [formGroup]="defaultForm">
        <ndwu-password-input-field
          formControlName="password"
          label="Password"
          placeholder="password-input-field-showcase.enter-password-placeholder"
          showPasswordIconLabel="password-input-field-showcase.show-password"
          hidePasswordIconLabel="password-input-field-showcase.hide-password"
          [strength]="defaultPasswordStrength()"
        />
      </form>
    </div>

    <div class="state-section">
      <h4>{{ 'password-input-field-showcase.weak-password' | localize }}</h4>
      <form [formGroup]="weakForm">
        <ndwu-password-input-field
          formControlName="password"
          label="Password"
          [strength]="weakPasswordStrength()"
        />
      </form>
    </div>

    <div class="state-section">
      <h4>{{ 'password-input-field-showcase.average-password' | localize }}</h4>
      <form [formGroup]="averageForm">
        <ndwu-password-input-field
          formControlName="password"
          label="Password"
          [strength]="averagePasswordStrength()"
        />
      </form>
    </div>

    <div class="state-section">
      <h4>{{ 'password-input-field-showcase.strong-password' | localize }}</h4>
      <form [formGroup]="strongForm">
        <ndwu-password-input-field
          formControlName="password"
          label="Password"
          showPasswordIconLabel="password-input-field-showcase.show-password"
          hidePasswordIconLabel="password-input-field-showcase.hide-password"
          [strength]="strongPasswordStrength()"
        />
      </form>
    </div>

  </ng-template>
</app-showcase-layout>
