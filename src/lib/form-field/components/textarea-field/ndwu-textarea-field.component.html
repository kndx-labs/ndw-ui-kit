<ndwu-form-field [size]="sizeSvc.size()" [readonly]="readonly()">
  @if (label()) {
    <ndwu-floating-label
      [label]="label()"
      [required]="ndwuRequired()"
    />
  }

  <ndwu-textarea
    [size]="sizeSvc.size()"
    [value]="value()"
    [placeholder]="placeholder()"
    [ariaLabel]="ariaLabel()"
    [ariaDescribedby]="hasHelperMessage() ? hintId : null"
    [required]="ndwuRequired()"
    [disabled]="isDisabledState()"
    [readonly]="readonly()"
    [invalid]="invalid()"
    [resizable]="resizable()"
    [showLineNumbers]="showLineNumbers()"
    (valueChange)="onValueChange($event)"
    (blurred)="onTouched()"
  >
    <ng-content select="[ndwuTextareaActions]" ngProjectAs="[ndwuTextareaActions]" />
  </ndwu-textarea>

  @if (hasHelperMessage()) {
    <ndwu-helper-message
      ndwuHint
      [id]="hintId"
      [status]="errorMessage() ? 'error' : 'default'"
      [errorMessage]="errorMessage()"
      [helperMessage]="hint()"
      [validationData]="validationData()"
    />
  }
</ndwu-form-field>
