<div class="sandbox">
  <div class="sandbox__toolbar">
    <app-theme-switcher
      [theme]="sandboxTheme()"
      (themeChange)="setSandboxTheme($any($event))"
    />

    <button
      type="button"
      class="sandbox__reset"
      (click)="resetSandbox()"
    >
      {{ 'common.reset' | localize }}
    </button>
  </div>

  <div class="sandbox__content">
    <div class="sandbox__preview">
      <h4 class="sandbox__section-title">{{ 'common.preview' | localize }}</h4>

      <div
        class="sandbox__preview-surface"
        #previewSurface
        [class.ndwu-theme-light]="sandboxTheme() === 'light'"
        [class.ndwu-theme-dark]="sandboxTheme() === 'dark'"
        [ngStyle]="sandboxTokenStyles()"
      >
        <ndwu-card
          [ngClass]="previewStateClass"
        >
          <p>{{ 'card-showcase.sandbox.content' | localize }}</p>
        </ndwu-card>
      </div>
    </div>

    <div class="sandbox__bottom">
      <div class="sandbox__controls">
        <h4 class="sandbox__section-title">{{ 'common.controls' | localize }}</h4>

        <form [formGroup]="sandboxForm" class="sandbox__controls-form">
          <div class="sandbox__control-row">
            <label
              class="sandbox__control-label"
              for="sandbox-state"
            >
              {{ 'card-showcase.sandbox.state' | localize }}
            </label>
            <select id="sandbox-state" class="sandbox__control-input" formControlName="state">
              <option [value]="CARD_STATE.DEFAULT">{{ 'card-showcase.sandbox.state-default' | localize }}</option>
              <option [value]="CARD_STATE.HOVER">{{ 'card-showcase.sandbox.state-hover' | localize }}</option>
              <option [value]="CARD_STATE.FOCUSED">{{ 'card-showcase.sandbox.state-focused' | localize }}</option>
              <option [value]="CARD_STATE.DISABLED">{{ 'card-showcase.sandbox.state-disabled' | localize }}</option>
            </select>
          </div>
        </form>
      </div>

      <div class="sandbox__variables">
        <app-token-list
          [tokens]="tokenList"
          [formGroup]="sandboxTokens"
          [tokenPickerValues]="tokenPickerValues()"
          [sectionTitle]="'card-showcase.sandbox.tokens' | localize"
          [inheritLabel]="'card-showcase.sandbox.inherit' | localize"
        />
      </div>
    </div>
  </div>
</div>
