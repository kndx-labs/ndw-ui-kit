<div [class]="hostClasses()">
  <ndwu-icon
    [name]="variantIcon()"
    class="ndwu-notification__icon"
  />
  <div class="ndwu-notification__content">
    @if (header()) {
      <span
        class="ndwu-notification__header"
        [innerHTML]="header() | localizeHtml"
      >
      </span>
    }

    <span
      class="ndwu-notification__message"
      [innerHTML]="message() | localizeHtml"
    >
    </span>
  </div>
</div>
