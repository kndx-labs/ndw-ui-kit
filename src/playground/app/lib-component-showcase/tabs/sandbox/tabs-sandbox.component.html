<div class="sandbox">
  <div class="sandbox__toolbar">
    <app-theme-switcher
      [theme]="sandboxTheme()"
      (themeChange)="setSandboxTheme($any($event))"
    />

    <button
      type="button"
      class="sandbox__reset"
      (click)="resetSandbox()"
    >
      {{ 'common.reset' | localize }}
    </button>
  </div>

  <div class="sandbox__content">
    <div class="sandbox__preview">
      <h4 class="sandbox__section-title">{{ 'common.preview' | localize }}</h4>

      <div
        class="sandbox__preview-surface"
        [class.ndwu-theme-light]="sandboxTheme() === 'light'"
        [class.ndwu-theme-dark]="sandboxTheme() === 'dark'"
      >
        <ndwu-tabs
          [tabs]="tabs()"
          [selectedTabId]="sandboxForm.controls.selectedTabId.value"
          [size]="sandboxForm.controls.size.value"
          [variant]="sandboxForm.controls.variant.value"
          [scrollMode]="sandboxForm.controls.scrollMode.value"
          [scrollContainerWidth]="sandboxForm.controls.scrollContainerWidth.value"
          [tabWidthMode]="sandboxForm.controls.tabWidthMode.value"
          (tabChange)="onTabChange($event)"
        />
      </div>
    </div>

    <div class="sandbox__controls">
      <h4 class="sandbox__section-title">{{ 'common.controls' | localize }}</h4>

      <form [formGroup]="sandboxForm" class="sandbox__controls-form">
        <div class="sandbox__control-row">
          <label for="size" class="sandbox__control-label">Size</label>
          <select name="size" class="sandbox__control-input" formControlName="size">
            @for (size of [SIZE.L, SIZE.XL, SIZE.XXL]; track size) {
              <option [value]="size">{{ size }}</option>
            }
          </select>
        </div>

        <div class="sandbox__control-row">
          <label for="variant" class="sandbox__control-label">Variant</label>
          <select name="variant" class="sandbox__control-input" formControlName="variant">
            <option value="default">Default</option>
            <option value="bordered">Bordered</option>
          </select>
        </div>

        <div class="sandbox__control-row">
          <label for="selectedTabId" class="sandbox__control-label">Selected Tab</label>
          <select name="selectedTabId" class="sandbox__control-input" formControlName="selectedTabId">
            @for (tab of tabs(); track tab.id) {
              <option [value]="tab.id">{{ tab.label }}</option>
            }
          </select>
        </div>

        <div class="sandbox__control-row">
          <label for="scrollMode" class="sandbox__control-label">Scroll Mode</label>
          <select name="scrollMode" class="sandbox__control-input" formControlName="scrollMode">
            <option value="auto">Auto (content width)</option>
            <option value="scrollable">Scrollable (fixed container)</option>
          </select>
        </div>

        @if (sandboxForm.controls.scrollMode.value === 'scrollable') {
          <div class="sandbox__control-row">
            <label for="scrollContainerWidth" class="sandbox__control-label">Container Width</label>
            <input
              type="text"
              name="scrollContainerWidth"
              class="sandbox__control-input"
              formControlName="scrollContainerWidth"
              placeholder="e.g., 368px"
            >
          </div>
        }

        <div class="sandbox__control-row">
          <label for="tabWidthMode" class="sandbox__control-label">Tab Width Mode</label>
          <select name="tabWidthMode" class="sandbox__control-input" formControlName="tabWidthMode">
            <option value="content">Content (auto width)</option>
            <option value="fixed">Fixed (160px L, 64px XL)</option>
          </select>
        </div>

        <div class="sandbox__control-row sandbox__control-row--full">
          <label for="tabsJson" class="sandbox__control-label">Tabs JSON</label>
          <textarea
            name="tabsJson"
            class="sandbox__control-textarea"
            id="sandbox-tabs-json"
            [value]="tabsJson()"
            (change)="updateTabsFromJson($any($event.target).value)"
            rows="6"
          ></textarea>
        </div>
        </form>
    </div>
  </div>
</div>
