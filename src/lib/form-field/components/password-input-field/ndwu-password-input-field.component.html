<ndwu-form-field [size]="sizeSvc.size()">
  @if (label()) {
    <ndwu-floating-label
      [label]="label()"
      [required]="ndwuRequired()"
    />
  }

<input
  ndwuInput
  [type]="inputType()"
  [value]="inputValue"
  [attr.value]="inputValue"
  [placeholder]="placeholder() ? (placeholder() | localize) : ''"
  [class]="inputClass()"
  [disabled]="isDisabled"
  (input)="onInput($event)"
  (blur)="onBlur()"
/>

  <button
    ndwuIconButton
    [icon]="eyeIcon()"
    variant="flat"
    class="ndwu-form-field__right-icon"
    ndwuSuffix
    (click)="togglePasswordVisibility()"
    [disabled]="isDisabled"
    [attr.aria-label]="eyeIconLabel() ? (eyeIconLabel() | localize) : undefined"
  >
  </button>
</ndwu-form-field>

<ndwu-password-strength-indicator
  [strength]="strength()"
/>

@if (errorMessage() || hint() || internalHint()) {
<ndwu-helper-message
  ndwuHint
  [errorMessage]="errorMessage()"
  [helperMessage]="hint() || internalHint()"
  [validationData]="validationData()"
  [status]="hintStatus()"
/>
}
