<div class="ndwu-password-strength-indicator">
  @for (segment of segments; track $index) {
    <span
      class="ndwu-password-strength-indicator__segment"
      [class.ndwu-password-strength-indicator__segment--weak]="strength() === 'weak'"
      [class.ndwu-password-strength-indicator__segment--average]="strength() === 'average'"
      [class.ndwu-password-strength-indicator__segment--strong]="strength() === 'strong'"
    ></span>
  }
</div>
