<div class="sandbox">
  <div class="sandbox__toolbar">
    <app-theme-switcher
      [theme]="sandboxTheme()"
      (themeChange)="setSandboxTheme($any($event))"
    />

    <button
      type="button"
      class="sandbox__reset"
      (click)="resetSandbox()"
    >
      {{ 'common.reset' | localize }}
    </button>
  </div>

  <div
    #previewSurface
    class="sandbox__preview-surface"
    [class.ndwu-theme-light]="sandboxTheme() === 'light'"
    [class.ndwu-theme-dark]="sandboxTheme() === 'dark'"
    [style]="sandboxTokenStyles()"
  >
    <div class="popover-preview-trigger">
      <button
        ndwu-button
        variant="primary"
        [ndwuPopover]="sandboxForm.controls.content.value"
        [popoverTitle]="sandboxForm.controls.title.value"
        [popoverShowHeader]="sandboxForm.controls.showHeader.value"
        [popoverShowClose]="sandboxForm.controls.showClose.value"
        [popoverSide]="sandboxForm.controls.side.value"
        [popoverAlign]="sandboxForm.controls.align.value"
        [popoverButtons]="buttons"
      >
        {{ 'popover-showcase.sandbox.preview-trigger' | localize }}
      </button>
    </div>
  </div>

  <div class="sandbox__bottom">
    <div class="sandbox__controls">
      <h4 class="sandbox__section-title">{{ 'common.controls' | localize }}</h4>
      <form [formGroup]="sandboxForm" class="sandbox__controls-form">
        <div class="sandbox__control-row">
          <label class="sandbox__control-label" for="popover-sandbox-content">{{ 'popover-showcase.sandbox.content' | localize }}</label>
          <textarea id="popover-sandbox-content" class="sandbox__control-input" rows="3" formControlName="content"></textarea>
        </div>

        <div class="sandbox__control-row">
          <label class="sandbox__control-label" for="popover-sandbox-title">{{ 'popover-showcase.sandbox.title' | localize }}</label>
          <input id="popover-sandbox-title" type="text" class="sandbox__control-input" formControlName="title" />
        </div>

        <div class="sandbox__control-row sandbox__control-row--checkboxes">
          <label class="sandbox__checkbox">
            <input type="checkbox" formControlName="showHeader" />
            <span>{{ 'popover-showcase.sandbox.show-header' | localize }}</span>
          </label>
          <label class="sandbox__checkbox">
            <input type="checkbox" formControlName="showClose" />
            <span>{{ 'popover-showcase.sandbox.show-close' | localize }}</span>
          </label>
        </div>

        <div class="sandbox__control-row">
          <label class="sandbox__control-label" for="popover-sandbox-side">Side</label>
          <select id="popover-sandbox-side" class="sandbox__control-input" formControlName="side">
            @for (side of popoverSideOptions; track side) {
              <option [value]="side">{{ side }}</option>
            }
          </select>
        </div>

        <div class="sandbox__control-row">
          <label class="sandbox__control-label" for="popover-sandbox-align">Align</label>
          <select id="popover-sandbox-align" class="sandbox__control-input" formControlName="align">
            @for (align of popoverAlignOptions; track align) {
              <option [value]="align">{{ align }}</option>
            }
          </select>
        </div>

        <div class="sandbox__control-row">
          <span class="sandbox__control-label">{{ 'popover-showcase.sandbox.buttons' | localize }}</span>

          <div>
            @for (btnGroup of buttonGroups; track $index) {
              <div class="button-row">
                <input type="text" class="sandbox__control-input" [formControl]="btnGroup.controls.label" />
                <label class="sandbox__checkbox">
                  <input type="checkbox" [formControl]="btnGroup.controls.primary" />
                  <span>{{ 'popover-showcase.sandbox.button-primary' | localize }}</span>
                </label>
                <button type="button" ndwu-button variant="tertiary" ndwuSize="S" (click)="removeButton($index)">×</button>
              </div>
            }

            <button type="button" ndwu-button variant="secondary" ndwuSize="S" (click)="addButton()">
              {{ 'popover-showcase.sandbox.add-button' | localize }}
            </button>
          </div>
        </div>
      </form>
    </div>

    <div class="sandbox__variables">
      <app-token-list
        [tokens]="tokenListForCurrentType()"
        [formGroup]="sandboxTokens"
        [tokenPickerValues]="tokenPickerValues()"
        [sectionTitle]="'popover-showcase.sandbox.tokens' | localize"
        [inheritLabel]="'popover-showcase.sandbox.inherit' | localize"
      />
    </div>
  </div>
</div>
