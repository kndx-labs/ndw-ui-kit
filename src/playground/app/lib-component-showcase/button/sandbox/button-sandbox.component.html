<div class="sandbox">
  <div class="sandbox__toolbar">
    <app-theme-switcher
      [theme]="sandboxTheme()"
      (themeChange)="setSandboxTheme($any($event))"
    />

    <button
      type="button"
      class="sandbox__reset"
      (click)="resetSandbox()"
    >
      {{ 'common.reset' | localize }}
    </button>
  </div>

  <div class="sandbox__content">
    <div class="sandbox__preview">
      <h4 class="sandbox__section-title">{{ 'common.preview' | localize }}</h4>

      <div
        class="sandbox__preview-surface"
        #previewSurface
        [class.ndwu-theme-light]="sandboxTheme() === 'light'"
        [class.ndwu-theme-dark]="sandboxTheme() === 'dark'"
        [ngStyle]="sandboxTokenStyles()"
      >
        <button
          ndwu-button
          [variant]="sandboxForm.controls.variant.value"
          [size]="sandboxForm.controls.size.value"
          [icon]="sandboxForm.controls.icon.value"
          [label]="sandboxForm.controls.label.value"
          [disabled]="sandboxForm.controls.isDisabled.value"
          [loading]="sandboxForm.controls.isLoading.value"
        >
        </button>
      </div>
    </div>

    <div class="sandbox__bottom">
      <div class="sandbox__controls">
        <h4 class="sandbox__section-title">{{ 'common.controls' | localize }}</h4>

        <form [formGroup]="sandboxForm" class="sandbox__controls-form">
          <div class="sandbox__control-row">
            <label class="sandbox__control-label" for="sandbox-label">{{ 'common.label' | localize }}</label>
            <input id="sandbox-label" class="sandbox__control-input" type="text" formControlName="label" />
          </div>

          <div class="sandbox__control-row">
            <label class="sandbox__control-label" for="sandbox-variant">{{ 'button-showcase.sandbox.btn-type' | localize }}</label>
            <select id="sandbox-variant" class="sandbox__control-input" formControlName="variant">
              <option [value]="BUTTON_TYPE.PRIMARY">{{ 'button-showcase.primary' | localize }}</option>
              <option [value]="BUTTON_TYPE.SECONDARY">{{ 'button-showcase.secondary' | localize }}</option>
              <option [value]="BUTTON_TYPE.TERTIARY">{{ 'button-showcase.tertiary' | localize }}</option>
              <option [value]="BUTTON_TYPE.GHOST">{{ 'button-showcase.ghost' | localize }}</option>
              <option [value]="BUTTON_TYPE.SECONDARY_NEGATIVE">{{ 'button-showcase.secondary-negative' | localize }}</option>
            </select>
          </div>

          <div class="sandbox__control-row">
            <label class="sandbox__control-label" for="sandbox-size">{{ 'common.size' | localize }}</label>
            <select id="sandbox-size" class="sandbox__control-input" formControlName="size">
              <option [value]="SIZE.S">{{ 'common.sizes.s' | localize }}</option>
              <option [value]="SIZE.L">{{ 'common.sizes.l' | localize }}</option>
              <option [value]="SIZE.XL">{{ 'common.sizes.xl' | localize }}</option>
              <option [value]="SIZE.XXL">{{ 'common.sizes.xxl' | localize }}</option>
            </select>
          </div>

          <div class="sandbox__control-row">
            <label class="sandbox__control-label" for="sandbox-icon">{{ 'button-showcase.sandbox.icon' | localize }}</label>
            <select id="sandbox-icon" class="sandbox__control-input" formControlName="icon">
              <option [ngValue]="null">{{ 'button-showcase.sandbox.icon-none' | localize }}</option>
              @for (iconName of SANDBOX_ICONS; track iconName) {
                <option [ngValue]="iconName">{{ iconName }}</option>
              }
            </select>
          </div>

          <div class="sandbox__control-row sandbox__control-row--checkboxes">
            <label class="sandbox__checkbox">
              <input type="checkbox" formControlName="isDisabled" />
              <span>{{ 'common.disabled' | localize }}</span>
            </label>
            <label class="sandbox__checkbox">
              <input type="checkbox" formControlName="isLoading" />
              <span>{{ 'common.loading' | localize }}</span>
            </label>
          </div>
        </form>
      </div>

      <div class="sandbox__variables">
        <app-token-list
          [tokens]="tokenListForCurrentType()"
          [formGroup]="sandboxTokens"
          [tokenPickerValues]="tokenPickerValues()"
          [sectionTitle]="'button-showcase.sandbox.tokens-for-type' | localize:{ type: sandboxForm.controls.variant.value }"
          [inheritLabel]="'button-showcase.sandbox.inherit' | localize"
        />
      </div>
    </div>
  </div>
</div>
