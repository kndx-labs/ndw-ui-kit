@if (effectiveLoading()) {
  <span class="ndwu-button__loader">
    <ndwu-spokes-loader
      [size]="loaderParams().size"
      [spokeWidth]="loaderParams().spokeWidth"
      [spokeHeight]="loaderParams().spokeHeight"
      [spokeOffset]="loaderParams().spokeOffset"
    />
  </span>
}

<span
  class="ndwu-button__label"
  [class.ndwu-button__label--hidden]="effectiveLoading()"
>
  @if (icon()) {
    <ndwu-icon
      class="ndwu-button__icon"
      name="{{ icon() }}"
    />
  }

  @if (label()) {
    {{ label() | localize }}
  } @else {
    <ng-content></ng-content>
  }
</span>
