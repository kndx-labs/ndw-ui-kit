<div [class]="rootClass()">
  <input
    #checkboxInput
    type="checkbox"
    class="ndwu-checkbox__input"
    [class.ndwu-checkbox__input--no-label]="!secondaryText() && (labelHidden() || !label())"
    [class.ndwu-checkbox__input--invalid]="invalid()"
    [id]="id()"
    [checked]="checked()"
    [disabled]="disabled()"
    [attr.tabindex]="inputTabIndex()"
    (change)="onCheckboxChange($event)"
    (focus)="onFocus()"
    (blur)="onBlur()"
  />

  @if (labelHidden()) {
    @if (label()) {
      <label
        class="ndwu-checkbox__hidden-label"
        [for]="id()"
      >
        {{ label() }}
      </label>
    }

    <!-- `labelHidden` hides the label text only, so secondary text stays visible. -->
    @if (secondaryText()) {
      <label [for]="id()">
        <ndwu-label-group
          [secondaryText]="secondaryText()"
          [disabled]="disabled()"
          [size]="sizeSvc.effectiveSize()"
        />
      </label>
    }
  } @else if (label() || secondaryText()) {
    <label [for]="id()">
      <ndwu-label-group
        [label]="label()"
        [secondaryText]="secondaryText()"
        [disabled]="disabled()"
        [size]="sizeSvc.effectiveSize()"
      />
    </label>
  }
</div>
