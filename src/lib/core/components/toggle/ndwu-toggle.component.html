<div [class]="rootClass()">
  <div
    class="ndwu-toggle__wrapper"
    [class.ndwu-toggle__wrapper--disabled]="disabled()"
  >
    <div class="ndwu-toggle__input-wrapper">
      <input
        type="checkbox"
        role="switch"
        class="ndwu-toggle__input"
        [id]="inputId()"
        [checked]="checked()"
        [disabled]="disabled()"
        [attr.name]="name()"
        [attr.value]="value()"
        [attr.aria-label]="ariaLabel()"
        [attr.aria-labelledby]="ariaLabelledby()"
        [attr.aria-describedby]="ariaDescribedby()"
        (change)="onToggleChange($event)"
        (focus)="onFocus()"
        (blur)="onBlur()"
      />
      <label
        class="ndwu-toggle__track"
        [for]="inputId()"
      >
        <span class="ndwu-toggle__knob"></span>
      </label>
    </div>

    @if (label() || secondaryText()) {
      <label [for]="inputId()">
        <ndwu-label-group
          [label]="label()"
          [secondaryText]="secondaryText()"
          [disabled]="disabled()"
          [size]="sizeSvc.effectiveSize()"
        />
      </label>
    }
  </div>
</div>
