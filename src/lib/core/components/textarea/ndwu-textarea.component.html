<div
  #box
  class="ndwu-textarea__box"
  [class.ndwu-textarea__box--focused]="focused() && !readonly()"
  [class.ndwu-textarea__box--invalid]="invalid()"
  [class.ndwu-textarea__box--disabled]="disabled()"
  [class.ndwu-textarea__box--readonly]="readonly()"
  [class.ndwu-textarea__box--has-actions]="hasActions()"
  [style.--ndwu-textarea-scrollbar-width]="scrollbarOffsetX()"
  [style.--ndwu-textarea-scrollbar-height]="scrollbarOffsetY()"
  [style.--ndwu-textarea-actions-width]="actionsWidth()"
  [style.--ndwu-textarea-actions-height]="actionsHeight()"
  [style.height.px]="height()"
>
  @if (showLineNumbers()) {
    <div class="ndwu-textarea__gutter" aria-hidden="true">
      <div
        class="ndwu-textarea__line-numbers"
        [style.transform]="`translateY(${-scrollTop()}px)`"
      >
        @for (line of lineNumbers(); track line) {
          <span class="ndwu-textarea__line-number">{{ line }}</span>
        }
      </div>
    </div>
  }

  <textarea
    #textarea
    class="ndwu-textarea__control"
    [ndwuResizeObserver]="resizable() || hasActions()"
    [id]="controlId()"
    [value]="currentValue()"
    [placeholder]="placeholder() ? (placeholder() | localize) : ''"
    [disabled]="disabled()"
    [readonly]="readonly()"
    [attr.wrap]="showLineNumbers() ? 'off' : null"
    [attr.aria-label]="ariaLabel() ? (ariaLabel() | localize) : null"
    [attr.aria-required]="required() ? 'true' : null"
    [attr.aria-invalid]="invalid() ? 'true' : null"
    [attr.aria-describedby]="ariaDescribedby()"
    (input)="onInput($event)"
    (focus)="focused.set(true)"
    (blur)="onBlur()"
    (scroll)="onScroll()"
    (wheel)="onWheel($event)"
    (elementResize)="onTextareaResize()"
  ></textarea>

  @if (hasActions()) {
    <div class="ndwu-textarea__actions-mask" aria-hidden="true"></div>
  }

  <div
    #actionsSlot
    class="ndwu-textarea__actions-slot"
    [ndwuResizeObserver]="true"
  >
    <ng-content select="[ndwuTextareaActions]" />
  </div>

  @if (resizable()) {
    <span
      class="ndwu-textarea__resizer"
      aria-hidden="true"
      (pointerdown)="onResizeStart($event)"
      (pointermove)="onResizeMove($event)"
      (lostpointercapture)="onResizeEnd()"
    >
      <ndwu-icon [name]="ICON_NAME.NOTCHES_S" />
    </span>
  }
</div>
