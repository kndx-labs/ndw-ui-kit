<app-showcase-layout
  lightTitleKey="common.themes.light"
  darkTitleKey="common.themes.dark"
>
  <ng-template let-theme="theme" let-idPrefix="idPrefix">
    <div class="state-section">
      <h4>Basic</h4>
      <form [formGroup]="formBasic">
        <ndwu-select-field
          label="Country"
          placeholder="Choose country"
          [options]="countryOptionsLongList"
          formControlName="country"
        />
      </form>
    </div>

    <div class="state-section">
      <h4>Disabled</h4>
      <form [formGroup]="formDisabled">
        <ndwu-select-field
          label="Country"
          placeholder="Choose country"
          [options]="countryOptions"
          formControlName="country"
        />
      </form>
    </div>

    <div class="state-section">
      <h4>Required</h4>
      <form [formGroup]="formRequired">
        <ndwu-select-field
          label="Country"
          placeholder="Choose country"
          [options]="countryOptions"
          formControlName="country"
          required
        />
      </form>
    </div>

    <div class="state-section">
      <h4>Sizes</h4>
      <form
        [formGroup]="formSizes"
        class="component-sizes"
      >
        @for (size of SIZES; track size) {
          <ndwu-select-field
            class="state-section__field"
            [label]="'Country (size: ' + size + ')'"
            placeholder="Choose country"
            [size]="size"
            [options]="countryOptionsLongList"
            [formControlName]="'country' + size.toUpperCase()"
          />
        }
      </form>
    </div>

    <div class="state-section">
      <h4>Select with long options</h4>
      <form [formGroup]="formLongOptions">
        <ndwu-select-field
          label="Long options"
          placeholder="Choose something"
          [options]="longLabelsOptionsList"
          formControlName="longOptionSelect"
        />
      </form>
    </div>
  </ng-template>
</app-showcase-layout>
